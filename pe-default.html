<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="./payment-element/dist/payment-element/browser/polyfills.js"></script>
    <script type="module" src="./payment-element/dist/payment-element/browser/main.js"></script>
  </head>
  <body>

    <h1>Plain HTML Host</h1>

    <payment-element id="pay"></payment-element>

    <script>
      const el = document.getElementById('pay');

      el.addEventListener('paymentToken', async (e) => {
        const token = e.detail;

        try {
          const res = await fetch('http://localhost:3000/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: token,
              amount: 250
            })
          });

          if (!res.ok) {
            throw new Error('HTTP error ' + res.status);
          }

          const result = await res.json();
          console.log('Payment API result:', result);

          // json-server always returns created object → treat as success
          alert('Payment successful! Transaction ID: ' + result.id);

        } catch (err) {
          console.error('Payment error:', err);
          alert('Payment failed');
        }
      });

    </script>

  </body>
</html>
