<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Page (Default)</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      background: #f9fafb;
    }

    iframe {
      width: 100%;
      max-width: 720px;
      height: 560px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .panel {
      max-width: 720px;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .panel.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .panel.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <h1>Checkout Page (Default)</h1>

  <iframe
    id="payment-frame"
    src="http://localhost:8080/index.html"
    sandbox="allow-scripts allow-same-origin"
  ></iframe>

  <div id="token-panel">
    Waiting for token…
  </div>

  <div id="result-panel"></div>

  <script>
    const tokenPanel = document.getElementById('token-panel');
    const resultPanel = document.getElementById('result-panel');
    const iframe = document.getElementById('payment-frame');

    window.addEventListener('message', async (event) => {
      if (!event.data?.type) return;

      if (event.data.type === 'PAYMENT_TOKEN') {
        const token = event.data.token;
        tokenPanel.textContent = `Received token: ${token}`;

        try {
          const res = await fetch('http://localhost:3000/api/v1/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              amount: 100,
            })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            resultPanel.innerHTML = `
              <div class="panel success">
                Payment successful<br />
                Transaction ID: <strong>${data.transactionId}</strong>
              </div>
            `;
          } else {
            throw data;
          }
        } catch (err) {
          resultPanel.innerHTML = `
            <div class="panel error">
              Payment failed<br />
              ${err.message || 'Unknown error'}
            </div>
          `;
        }
      }

      // optional: validation error from component
      if (event.data.type === 'PAYMENT_ERROR') {
        resultPanel.innerHTML = `
          <div class="panel error">
            ${event.data.message}
          </div>
        `;
      }
    });

  </script>

</body>
</html>
