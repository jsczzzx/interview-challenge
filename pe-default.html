<!DOCTYPE html>
<html>
  <head>
    <title>Host Application - Payment Component Integration</title>
    <style>
      body { 
        font-family: sans-serif; 
        padding: 20px; 
        max-width: 800px;
        margin: 0 auto; 
      }
      iframe {
        width: 100%;
        max-width: 600px;
        height: 500px;
        margin-bottom: 20px;
        background-color: whitesmoke;
      }
      #status {
        padding: 15px;
        border-radius: 4px;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      .initial { background-color: #f0f0f0; color: #333; }
      .success { background-color: #e6ffe6; color: green; border: 1px solid green; }
      .failure { background-color: #ffe6e6; color: red; border: 1px solid red; }
      .token-info { margin-top: 10px; font-size: small; color: #555; }
      .response-output { white-space: pre-wrap; background-color: #f7f7f7; padding: 10px; border-radius: 4px; }
    </style>
  </head>
  <body>

    <h1>Checkout - Order Total $100.00</h1>
    <p>Please enter payment information in the iFrame below. Sensitive data is securely tokenized.</p>

    <iframe
      id="paymentFrame"
      src="http://localhost:4200"
    ></iframe>

    <div id="status" class="initial">Awaiting secure token from payment component...</div>
    <div id="tokenOutput" class="token-info"></div>
    <h3>Payment API Response:</h3>
    <pre id="responseOutput" class="response-output">Awaiting transaction completion...</pre>

    <script>
      const statusDiv = document.getElementById('status');
      const tokenOutputDiv = document.getElementById('tokenOutput');
      const responseOutputDiv = document.getElementById('responseOutput');

      const PAY_API_URL = 'http://localhost:3000/api/v1/pay';
      const IFRAME_ORIGIN = 'http://localhost:4200'; 
      
      window.addEventListener('message', (event) => {
        if (event.origin !== IFRAME_ORIGIN) {
          console.warn('Received message from unknown origin:', event.origin);
          return; 
        }

        const data = event.data;

        if (data.type === 'paymentToken' && data.token) {
          const paymentToken = data.token;
          
          statusDiv.className = 'initial';
          statusDiv.textContent = 'Received secure token. Calling Payment API...';
          tokenOutputDiv.textContent = `Token: ${paymentToken}`;

          handlePayment(paymentToken);
        }
        
        if (data.type === 'validationError' && data.message) {
            statusDiv.className = 'failure';
            statusDiv.textContent = `Component Validation Error: ${data.message}`;
        }
      });

      async function handlePayment(token) {
        responseOutputDiv.textContent = 'Sending payment request...';
        try {
          const response = await fetch(PAY_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              token: token,
              amount: 1000,
              postalCode: '90210' 
            })
          });

          const result = await response.json();
          responseOutputDiv.textContent = JSON.stringify(result, null, 2);

          if (response.ok && result.success) {
            statusDiv.className = 'success';
            statusDiv.textContent = `Payment Successful! Transaction ID: ${result.transactionId}`;
          } else {
            statusDiv.className = 'failure';
            statusDiv.textContent = `Payment Failed: ${result.message || 'Transaction not completed'}`;
          }

        } catch (error) {
          statusDiv.className = 'failure';
          statusDiv.textContent = `Payment Request Failed (Network Error): ${error.message}`;
          responseOutputDiv.textContent = `Error: ${error.message}`;
          console.error('Payment API Call Failed:', error);
        }
      }

      console.log("Host application initialized and listening for iFrame messages.");

    </script>

  </body>
</html>
