<!DOCTYPE html>
<html>
  <head>
    <title>Host App - Payment Challenge Integration</title>
    <style>
      body { 
        font-family: sans-serif; 
        padding: 20px; 
        max-width: 800px;
        margin: 0 auto; 
      }
      iframe {
        width: 100%;
        max-width: 600px; /* 更新后的最大宽度 */
        height: 600px;  /* 更新后的高度 */
        border: 1px solid #ccc; /* 添加边框以区分 */
        border-radius: 8px;
        display: block;
        margin-bottom: 20px;
      }
      #status {
        padding: 15px;
        border-radius: 4px;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      .initial { background-color: #f0f0f0; color: #333; }
      .success { background-color: #e6ffe6; color: green; border: 1px solid green; }
      .failure { background-color: #ffe6e6; color: red; border: 1px solid red; }
      .token-info { margin-top: 10px; font-size: small; color: #555; }
      .response-output { white-space: pre-wrap; background-color: #f7f7f7; padding: 10px; border-radius: 4px; }
    </style>
  </head>
  <body>

    <h1>Checkout - 订单金额 $100.00</h1>
    <p>请在下方 iFrame 中输入支付信息并提交。敏感信息将直接流向令牌化服务。</p>

    <iframe
      id="paymentFrame"
      src="http://localhost:4200"
    ></iframe>

    <div id="status" class="initial">等待支付组件发送安全令牌...</div>
    <div id="tokenOutput" class="token-info"></div>
    <h3>支付 API 响应:</h3>
    <pre id="responseOutput" class="response-output">等待交易完成...</pre>

    <script>
      const statusDiv = document.getElementById('status');
      const tokenOutputDiv = document.getElementById('tokenOutput');
      const responseOutputDiv = document.getElementById('responseOutput');

      // 虚拟 API 支付端点 (假设您的 JSON Server 运行在 3000 端口)
      const PAY_API_URL = 'http://localhost:3000/api/v1/pay';
      // iFrame 的源，用于安全验证
      const IFRAME_ORIGIN = 'http://localhost:4200'; 
      
      // 1. 监听来自 iFrame 的消息 (安全令牌)
      window.addEventListener('message', (event) => {
        // **安全检查:** 严格验证消息的来源 (Source Origin)
        if (event.origin !== IFRAME_ORIGIN) {
          console.warn('Received message from unknown origin:', event.origin);
          return; 
        }

        const data = event.data;

        // 检查消息类型是否为我们期望的 'paymentToken'
        if (data.type === 'paymentToken' && data.token) {
          const paymentToken = data.token;
          
          statusDiv.className = 'initial';
          statusDiv.textContent = '✅ 接收到安全令牌，正在调用支付 API...';
          tokenOutputDiv.textContent = `令牌 (Token): ${paymentToken}`;

          // 2. 接收到令牌后，调用虚拟的支付处理 API
          handlePayment(paymentToken);
        }
        
        // 可选：监听 iFrame 中的验证或加载状态
        if (data.type === 'validationError' && data.message) {
            statusDiv.className = 'failure';
            statusDiv.textContent = `🚨 组件验证错误: ${data.message}`;
        }
      });

      /**
       * 模拟宿主应用后端使用令牌进行支付
       * @param {string} token - 从 iFrame 接收的安全支付令牌
       */
      async function handlePayment(token) {
        responseOutputDiv.textContent = '正在发送支付请求...';
        try {
          const response = await fetch(PAY_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              token: token,
              // 模拟发送其他支付所需的数据
              amount: 1000,
              postalCode: '90210' 
            })
          });

          // 检查响应状态
          const result = await response.json();
          responseOutputDiv.textContent = JSON.stringify(result, null, 2);

          if (response.ok && result.success) {
            statusDiv.className = 'success';
            statusDiv.textContent = `🎉 支付成功！交易ID: ${result.transactionId}`;
          } else {
            statusDiv.className = 'failure';
            // 即使 HTTP 状态码不是 200，也使用 API 返回的错误信息
            statusDiv.textContent = `❌ 支付失败: ${result.message || '交易未完成'}`;
          }

        } catch (error) {
          statusDiv.className = 'failure';
          statusDiv.textContent = `🚨 支付请求失败 (网络错误): ${error.message}`;
          responseOutputDiv.textContent = `错误: ${error.message}`;
          console.error('Payment API Call Failed:', error);
        }
      }

      console.log("宿主应用已启动，正在监听 iFrame 消息...");

    </script>

  </body>
</html>
