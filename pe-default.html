<!DOCTYPE html>
<html>
  <head>
    <title>Host App</title>
    <style>
      iframe {
        width: 100%;
        max-width: 420px;
        height: 420px;
        border: none;
      }
    </style>
  </head>
  <body>

    <h1>Checkout</h1>

    <iframe
      id="paymentFrame"
      src="http://localhost:4200"
    ></iframe>

    <script>
      window.addEventListener('message', async (event) => {
        if (event.data?.type !== 'paymentToken') return;

        const token = event.data.token;
        console.log('Host received token:', token);

        try {
          const res = await fetch('http://localhost:3000/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: token,
              amount: 945
            })
          });

          const result = await res.json();

          if (result.success) {
            alert('Payment successful! Transaction: ' + result.transactionId);
          } else {
            alert('Payment failed: ' + result.message);
          }

        } catch (err) {
          console.error(err);
          alert('Network error');
        }
      });
    </script>

  </body>
</html>
