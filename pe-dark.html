<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout (Dark)</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      background: #f9fafb;
    }

    iframe {
      width: 100%;
      max-width: 600px;
      height: 340px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .panel {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .success { background: #ecfdf5; color: #065f46; }
    .error   { background: #fef2f2; color: #991b1b; }
    .info    { background: #ffffff; }
  </style>
</head>

<body>

  <h1>Checkout (Dark)</h1>

  <iframe
    id="payment-frame"
    src="http://localhost:8080/index.html"
    sandbox="allow-scripts allow-same-origin"
  ></iframe>

  <div>
    <button id="place-order" disabled>
      Place Order
    </button>
  </div>


  <div id="status" class="panel info">
    Waiting for payment details…
  </div>

<script>
  const iframe = document.getElementById('payment-frame');
  const button = document.getElementById('place-order');
  const statusPanel = document.getElementById('status');

  let paymentStatus = 'INVALID';

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data?.type) return;

    if (data.type === 'PAYMENT_STATUS') {
      paymentStatus = data.status;
      button.disabled = paymentStatus !== 'VALID';
    }

    if (data.type === 'PAYMENT_RESULT') {
      if (data.success) {
        statusPanel.className = 'panel success';
        statusPanel.textContent =
          `Payment successful — Transaction ${data.result.transactionId}`;
      } else {
        statusPanel.className = 'panel error';
        statusPanel.textContent =
          data.result.message || 'Payment failed';
      }
    }

    if (data.type === 'PAYMENT_ERROR') {
      statusPanel.className = 'panel error';
      statusPanel.textContent = data.message;
    }
  });

  button.onclick = () => {
    iframe.contentWindow.postMessage(
      { type: 'REQUEST_SUBMIT' },
      '*'
    );
  };

  iframe.onload = () => {
    iframe.contentWindow.postMessage({
      type: 'SET_THEME',
      variables: {
        '--pe-color-bg': '#020617',
        '--pe-color-text': '#e5e7eb',
        '--pe-color-border': '#1e293b',
        '--pe-color-primary': '#2563eb'
      }
    }, '*');
  };
</script>


</body>
</html>
