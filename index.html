<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Element</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>

  <payment-element></payment-element>

  <!-- Angular runtime -->
  <script src="./payment-element/dist/payment-element/browser/polyfills.js" type="module"></script>
  <script src="./payment-element/dist/payment-element/browser/main.js" type="module"></script>

  <script>
    const el = document.querySelector('payment-element');

    const PAYMENT_ORIGIN = 'http://localhost:8080';

    /* ---------- element → host ---------- */

    el.addEventListener('statusChange', (e) => {
      window.parent.postMessage({
        type: 'PAYMENT_STATUS',
        status: e.detail
      }, PAYMENT_ORIGIN);
    });

    el.addEventListener('validationError', (e) => {
      window.parent.postMessage({
        type: 'PAYMENT_ERROR',
        message: e.detail
      }, PAYMENT_ORIGIN);
    });

    el.addEventListener('paymentData', async (e) => {
      window.parent.postMessage({
        type: 'PAYMENT_PROCESSING'
      }, PAYMENT_ORIGIN);

      try {
        const res = await fetch('http://localhost:3000/api/v1/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...e.detail,
            amount: 1999
          })
        });

        const result = await res.json();

        window.parent.postMessage({
          type: 'PAYMENT_RESULT',
          success: res.ok && result.success,
          result
        }, PAYMENT_ORIGIN);

      } catch (err) {
        window.parent.postMessage({
          type: 'PAYMENT_RESULT',
          success: false,
          result: { message: 'Network error' }
        }, PAYMENT_ORIGIN);
      }
    });

    /* ---------- host → element ---------- */

    window.addEventListener('message', (event) => {
      if (!event.data?.type) return;

      if (event.data.type === 'REQUEST_SUBMIT') {
        el.dispatchEvent(new CustomEvent('requestSubmit'));
      }

      if (event.data.type === 'SET_THEME') {
        Object.entries(event.data.variables || {}).forEach(([k, v]) => {
          document.documentElement.style.setProperty(k, v);
        });
      }
    });
  </script>

</body>
</html>
