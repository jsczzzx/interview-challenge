<form [formGroup]="paymentForm">
    <div class="form-row">
        <div class="form-group">
            <label for="card-number">Card number</label>
            <input id="card-number" formControlName="cardNumber" placeholder="1234 1234 1234 1234">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="expiration-date">Expiration date</label>
            <input id="expiration-date" formControlName="expirationDate" placeholder="MM/YY">
        </div>
        <div class="form-group">
            <label for="security-code">Security code</label>
            <input id="security-code" formControlName="securityCode" placeholder="CVC">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="postal-code">Postal code</label>
            <input id="postal-code" formControlName="postalCode" placeholder="12345">
        </div>
    </div>    

</form>
